name: Deploy SeatSpot to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/seatspot-site"
          cp index.html .nojekyll "$RUNNER_TEMP/seatspot-site/"
          cp -R assets "$RUNNER_TEMP/seatspot-site/"
      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/seatspot-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
