<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="/assets/seatspot.css">
  <title>SeatSpot Staff</title>
</head>
<body>
<div class="app screen">
  <header class="header">
    <a class="brand brand-link" href="/">Seat<span>Spot</span></a>
    <div class="header-actions staff-header"><span class="badge">STAFF</span><a class="btn secondary" href="/">Customer site</a></div>
  </header>
  <main class="main">
    <h1>Cookie Corner staff</h1>
    <div class="sub">Shared cookie stock and orders</div>
    <p id="staffMessage" class="small" role="status" aria-live="polite">Checking staff session…</p>
    <section id="staffLogin" class="card login-card" hidden>
      <h2>Staff sign in</h2>
      <p class="small">Use your authorized staff account.</p>
      <form id="loginForm">
        <label>Email<input name="email" id="staffEmail" type="email" autocomplete="username" required maxlength="320"></label>
        <label>Password<input name="password" id="staffPassword" type="password" autocomplete="current-password" required maxlength="1000"></label>
        <button class="btn wide" id="staffLoginButton" type="submit">Sign in</button>
      </form>
    </section>
    <section id="staffDashboard" hidden>
      <div class="row between staff-toolbar"><div><b id="staffIdentity"></b><p class="small">Updates automatically every 3 seconds</p></div><button class="btn secondary" id="staffLogout">Sign out</button></div>
      <h2 class="section-title">Inventory</h2>
      <div id="staffInventory" class="staff-inventory"></div>
      <div class="row between staff-toolbar"><h2 class="section-title">Orders</h2><button class="btn secondary" id="staffRefresh">Refresh now</button></div>
      <div class="card order-list-wrap">
        <table class="staff-orders">
          <thead><tr><th>Customer name</th><th>Table</th><th>Cookie</th><th>Quantity</th><th>Time ordered</th><th>Status</th></tr></thead>
          <tbody id="staffOrders"></tbody>
        </table>
        <p id="noStaffOrders" class="small" hidden>No orders yet.</p>
      </div>
    </section>
  </main>
</div>
<script src="/assets/backend-api.js"></script>
<script src="/assets/admin.js"></script>
</body>
</html>
